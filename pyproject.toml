[build-system]
# setuptools floor is a security minimum (CVE-2026-59890, fixed in 83.0.0);
# it only governs the isolated build environment, not the installed app.
requires = ["setuptools>=83", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "talkpipe-writing-assistant"
authors = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"},
]
maintainers = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"}
]
description = "AI-powered writing assistant for structured document generation"
readme = "README.md"
requires-python = ">=3.11.4"
keywords = ["ai", "writing", "assistant", "document", "generation"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Some lower bounds below are security floors rather than feature
# requirements: the lowest release of that package with no known
# vulnerability, as reported by `safety`. Left lower, a resolver is free to
# pick a known-vulnerable old release, which is what the scan flags. Every
# floor is at or below the version currently resolved, so raising them does
# not change what actually installs -- raise a floor when a new advisory
# lands, do not lower one.
dependencies = [
    "talkpipe[all]>=1.0.0b5",
    "fastapi[standard]>=0.133.0",  # >=0.133 drops starlette<1 so Starlette 1.x can be required below
    "starlette>=1.3.1",  # security floor
    "uvicorn>=0.24.0",
    "jinja2>=3.1.6",  # security floor
    "python-multipart>=0.0.31",  # security floor
    "pydantic>=2.4.0",  # security floor
    "fastapi-users[sqlalchemy]>=15.0.2",  # security floor
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",  # For testing FastAPI endpoints
    # Lint/type tools are pinned to a minor series on purpose: ruff promotes
    # new rules and mypy adds checks in minor releases, and CI resolves fresh,
    # so an open floor would turn a tool release into a red build. Bump the
    # pins deliberately (and the ruff-pre-commit rev with them).
    "ruff>=0.16.3,<0.17",
    "mypy>=2.3,<3",
    "pre-commit>=4.0",
    "bandit>=1.7.7",
    "safety>=2.3.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
]
security = [
    "bandit>=1.7.7",
    "safety>=2.3.0",
]

[project.scripts]
writing-assistant = "writing_assistant.app.server:main"
writing-assistant-create-superuser = "writing_assistant.create_superuser:main"
writing-assistant-admin = "writing_assistant.admin_users:main"

[project.urls]
Homepage = "https://github.com/sandialabs/talkpipe-writing-assistant"
Repository = "https://github.com/sandialabs/talkpipe-writing-assistant"
Documentation = "https://github.com/sandialabs/talkpipe-writing-assistant#readme"
"Bug Tracker" = "https://github.com/sandialabs/talkpipe-writing-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json"]
"writing_assistant.app" = ["templates/**/*", "static/**/*"]

[tool.uv]
# Commit uv.lock for reproducible dev/CI installs; use `uv lock` / `uv lock --upgrade`.

[tool.setuptools_scm]
# Use defaults

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/writing_assistant --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/writing_assistant"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# *.md: ruff would otherwise reformat Python code blocks in prose; the docs
# are not part of this gate.
extend-exclude = ["build", "dist", ".venv", "*.md"]

[tool.ruff.lint]
# An explicit select rather than ruff's (version-dependent) defaults, so a
# ruff upgrade never silently changes what CI enforces. CI fails on any
# finding; there is no advisory pass.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE", "RUF", "PERF", "RET", "ISC", "FLY",
    "PT",       # pytest style
    "T10",      # debugger left in
    "LOG", "G", # logging
    "PGH",      # blanket noqa / type: ignore
    "PLE",      # pylint errors only
]
ignore = [
    "E501",   # line length: ruff format governs code; long strings/docstrings stay
    "ISC001", # conflicts with the formatter
    "G004",   # f-strings in logging calls are accepted style here
]

[tool.ruff.lint.per-file-ignores]
# pytest-style rules only make sense in the test suite (an application
# function that happens to be named test_* is not a test).
"src/**" = ["PT"]
# Tests assert on exception *types* deliberately; requiring a message match
# on every `pytest.raises` adds noise without catching bugs.
"tests/**" = ["PT011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the documented way to declare
# parameters; they are not the mutable-default trap B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
]

[tool.ruff.lint.isort]
known-first-party = ["writing_assistant"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# 3.12+ so mypy can parse modern dependency stubs (e.g. numpy uses `type`
# statements); the package itself still supports Python 3.11.
python_version = "3.12"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
#skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/conftest.py"]
