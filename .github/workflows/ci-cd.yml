name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'bugfix/**', 'feature/**', "chore/**" ]
  pull_request:
    branches: [ main, 'bugfix/**', 'feature/**', "chore/**"  ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        # Install with pip, not from uv.lock, and resolve fresh. This package
        # is published, so CI must resolve the way `pip install
        # talkpipe-writing-assistant` does -- the build should break when a
        # user's install would. A lockfile here would hide exactly that.
        # Install into a project venv rather than the interpreter itself: on a
        # self-hosted runner /opt/hostedtoolcache is a volume shared by every
        # job, so installing there leaks packages between repos.
        # --upgrade-deps: a fresh venv seeds pip and, on Python < 3.12,
        # setuptools from the interpreter's bundled wheels, which lag PyPI
        # by many releases. Nothing here depends on setuptools at runtime,
        # but that seeded copy sits in the scanned environment and has
        # failed the Safety scan (CVE-2026-59890, fixed in setuptools 83),
        # so upgrade the seeded packages to current releases first.
        python -m venv --upgrade-deps .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/pip install -e .[dev]

    - name: Run tests with coverage
      run: |
        pytest --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests

  lint:
    # Ruff (lint + format) and mypy gate the build; there is no advisory
    # pass and nothing here may swallow a failure. Local equivalent:
    # `pre-commit run --all-files`, or the three commands below.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        # see the note on the test job's install step
        python -m venv --upgrade-deps .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/pip install -e ".[dev]"

    - name: Ruff lint
      run: ruff check --output-format=github .

    - name: Ruff format check
      run: ruff format --check --diff .

    - name: mypy
      run: mypy

  lockfile-check:
    # uv.lock is a development convenience only -- CI installs with pip on
    # purpose (see README, "Development environment"). This job installs
    # nothing from the lock; it only fails when uv.lock has drifted out of
    # sync with pyproject.toml, so the committed lock cannot go stale
    # unnoticed.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Check uv.lock is in sync with pyproject.toml
      run: uv lock --check

  security-scan:
    runs-on: ubuntu-latest
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies for security scan
      run: |
        # see the note on the test job's install step
        python -m venv --upgrade-deps .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/pip install -e .[dev,security]

    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json
        bandit -r src/ -f txt

    - name: Run Safety dependency scan
      run: |
        if [ -n "${SAFETY_API_KEY:-}" ]; then
          # Authenticated: the commercial database, gated by .safety-policy.yml.
          safety scan --save-as json safety-report.json
          safety scan
        else
          # Gitea withholds every secret from pull_request runs -- it flags AGit
          # merge requests as fork pull requests even when head and base are the
          # same repo. Rather than fail for lack of auth, fall back to the free
          # database. This still fails the build on a known vulnerability; the
          # data is just staler than the authenticated scan that gates pushes.
          echo "SAFETY_API_KEY unavailable; falling back to 'safety check' (free database)."
          # `check` is the legacy command and the only one that runs without an
          # account. It rejects .safety-policy.yml because that file is v3.0 and
          # only `scan` parses v3, so run it from a directory holding no policy
          # file; it scans the installed environment either way.
          report="$PWD/safety-report.json"
          workdir="$(mktemp -d)"
          (cd "$workdir" && safety check --save-json "$report")
        fi

    - name: Upload security scan results
      uses: actions/upload-artifact@v7
      # upload-artifact v4+ refuses to run when the server isn't github.com
      if: always() && github.server_url == 'https://github.com'
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-container:
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    # pushes to ghcr.io with a GitHub token; no equivalent on Gitea
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools_scm needs tags to compute the version

    - name: Compute package version
      id: pkg-version
      run: |
        python3 -m pip install --user setuptools_scm
        echo "version=$(python3 -m setuptools_scm)" >> "$GITHUB_OUTPUT"

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      if: github.event_name == 'release'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          type=raw,value=experimental,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        # only releases publish images; other runs build (and Trivy-scan)
        # without pushing, so `load` puts the image in the local daemon
        push: ${{ github.event_name == 'release' }}
        load: ${{ github.event_name != 'release' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ steps.pkg-version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract first tag for Trivy
      id: first-tag
      run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> $GITHUB_OUTPUT

    - name: Run container security scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.first-tag.outputs.tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # needs GitHub's code-scanning API, which Gitea does not implement
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  publish-package:
    runs-on: ubuntu-latest
    needs: [test, security-scan, build-container]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*